<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>語音輸入與朗讀</title><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:light}body{background:#f5f7fb}.card{box-shadow:0 16px 50px rgba(31,45,80,.08)}.pulse{animation:pulse 1.3s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(239,68,68,.12)}}textarea{resize:vertical}
</style>
</head>
<body class="min-h-screen text-slate-800">
<main class="mx-auto max-w-4xl px-4 py-8 sm:py-12">
<header class="mb-7 flex items-center gap-4"><div class="grid h-14 w-14 place-items-center rounded-2xl bg-indigo-600 text-2xl text-white shadow-lg shadow-indigo-200">🎙️</div><div><p class="text-xs font-bold uppercase tracking-[.18em] text-indigo-600">VOICE · LISTEN · PRACTISE</p><h1 class="text-2xl font-extrabold sm:text-3xl">語音輸入與朗讀</h1><p class="mt-1 text-sm text-slate-500">講英文或香港廣東話，亦可以將文字讀出來。</p></div></header>
<section class="card rounded-3xl border border-slate-100 bg-white p-5 sm:p-8">
<div class="mb-5 grid gap-4 sm:grid-cols-2">
<label class="block"><span class="mb-2 block text-sm font-bold">🎤 語音輸入語言</span><select id="recLang" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-indigo-500"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="zh-HK" selected>廣東話（香港）</option></select></label>
<label class="block"><span class="mb-2 block text-sm font-bold">🔊 朗讀語言</span><select id="speakLang" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-indigo-500"><option value="zh-HK">廣東話（香港）</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select></label>
</div>
<div class="relative"><textarea id="text" rows="8" placeholder="按住錄音按鈕開始講，或在這裡輸入／貼上文字……" class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 text-base leading-7 outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"></textarea><div class="mt-2 flex items-center justify-between text-xs text-slate-400"><span id="liveHint">支援英文及香港廣東話輸入</span><span><span id="count">0</span> 字</span></div></div>
<div class="mt-5 flex flex-wrap items-center gap-3">
<button id="recordBtn" class="inline-flex items-center gap-2 rounded-xl bg-rose-600 px-5 py-3 font-bold text-white shadow-md shadow-rose-200 transition hover:bg-rose-700"><span id="micIcon">🎙️</span><span id="recordLabel">開始語音輸入</span></button>
<button id="speakBtn" class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white shadow-md shadow-indigo-200 transition hover:bg-indigo-700"><span>▶</span> 朗讀文字</button>
<button id="pauseBtn" class="rounded-xl border border-slate-200 px-4 py-3 font-semibold text-slate-700 hover:bg-slate-50" disabled>⏸ 暫停</button>
<button id="clearBtn" class="ml-auto rounded-xl px-4 py-3 font-semibold text-slate-500 hover:bg-slate-100">清除</button>
</div>
<div id="status" role="status" aria-live="polite" class="mt-5 min-h-12 rounded-xl bg-slate-50 px-4 py-3 text-sm text-slate-600">準備就緒。選擇語言後，開始說話或輸入文字。</div>
<div class="mt-5 rounded-2xl bg-indigo-50 p-4 text-sm leading-6 text-indigo-950"><strong>使用小貼士</strong><ul class="mt-1 list-inside list-disc text-indigo-900/80"><li>語音輸入需要瀏覽器支援，並允許使用咪高峰；建議使用 Chrome 或 Edge。</li><li>朗讀聲線取決於裝置已安裝的語音。若沒有合適聲線，請到裝置設定新增語言語音。</li></ul></div>
</section>
<footer class="mt-5 text-center text-xs text-slate-400">英文練習 · 廣東話聆聽 · 文字朗讀</footer>
</main>
<script>
const textEl=document.getElementById('text'), recLang=document.getElementById('recLang'), speakLang=document.getElementById('speakLang'), statusEl=document.getElementById('status'), recordBtn=document.getElementById('recordBtn'), recordLabel=document.getElementById('recordLabel'), micIcon=document.getElementById('micIcon'), pauseBtn=document.getElementById('pauseBtn');
let recognition=null, recording=false, baseText='', finalText='';
function setStatus(msg,kind='normal'){statusEl.textContent=msg;statusEl.className='mt-5 min-h-12 rounded-xl px-4 py-3 text-sm '+(kind==='error'?'bg-rose-50 text-rose-700':kind==='ok'?'bg-emerald-50 text-emerald-700':'bg-slate-50 text-slate-600')}
function updateCount(){document.getElementById('count').textContent=[...textEl.value].length}
textEl.addEventListener('input',updateCount);updateCount();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){recordBtn.disabled=true;recordBtn.classList.add('opacity-50','cursor-not-allowed');setStatus('此瀏覽器未支援語音輸入。請嘗試使用 Chrome 或 Edge。','error')}
function makeRecognition(){if(!SR)return;recognition=new SR();recognition.lang=recLang.value;recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{recording=true;recordLabel.textContent='停止語音輸入';micIcon.textContent='⏹';recordBtn.classList.add('pulse');setStatus('正在聆聽……請開始說話。')};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=part;else interim+=part}textEl.value=baseText+(baseText&&finalText?' ':'')+finalText+(interim?' '+interim:'');updateCount();document.getElementById('liveHint').textContent=interim?'辨識中：'+interim:'語音輸入進行中'};recognition.onerror=e=>{const msg=e.error==='not-allowed'?'咪高峰權限未開啟，請在瀏覽器設定允許使用咪高峰。':e.error==='no-speech'?'未偵測到說話聲，請再試一次。':'語音辨識遇到問題（'+e.error+'），請稍後再試。';setStatus(msg,'error')};recognition.onend=()=>{recording=false;recordLabel.textContent='開始語音輸入';micIcon.textContent='🎙️';recordBtn.classList.remove('pulse');document.getElementById('liveHint').textContent='支援英文及香港廣東話輸入';if(finalText)setStatus('語音輸入完成，可以編輯文字或按「朗讀文字」。','ok')};}
recordBtn.addEventListener('click',()=>{if(!SR)return;if(recording){recognition.stop();return}try{baseText=textEl.value.trim();finalText='';makeRecognition();recognition.start()}catch(err){setStatus('無法開始語音輸入，請確認咪高峰可用後再試。','error')}});
recLang.addEventListener('change',()=>{if(recording){recognition.stop();setStatus('語言已更改，請重新開始語音輸入。')}});
function chooseVoice(lang){const voices=speechSynthesis.getVoices();const exact=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase());if(exact)return exact;const prefix=lang.split('-')[0].toLowerCase();return voices.find(v=>v.lang.toLowerCase().startsWith(prefix))||null}
document.getElementById('speakBtn').addEventListener('click',()=>{const value=textEl.value.trim();if(!value){setStatus('請先輸入文字，或使用語音輸入。','error');return}if(!('speechSynthesis'in window)){setStatus('此瀏覽器未支援文字朗讀。','error');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang=speakLang.value;const voice=chooseVoice(u.lang);if(voice)u.voice=voice;u.rate=0.92;u.onstart=()=>{setStatus('正在朗讀：'+(voice?voice.name:u.lang),'ok');pauseBtn.disabled=false};u.onend=()=>{setStatus('朗讀完成。','ok');pauseBtn.disabled=true;pauseBtn.textContent='⏸ 暫停'};u.onerror=()=>{setStatus('朗讀未能播放，請檢查裝置的語音設定。','error');pauseBtn.disabled=true};speechSynthesis.speak(u)});
pauseBtn.addEventListener('click',()=>{if(speechSynthesis.paused){speechSynthesis.resume();pauseBtn.textContent='⏸ 暫停';setStatus('繼續朗讀。')}else if(speechSynthesis.speaking){speechSynthesis.pause();pauseBtn.textContent='▶ 繼續';setStatus('朗讀已暫停。')}});
document.getElementById('clearBtn').addEventListener('click',()=>{if(recording)recognition.stop();speechSynthesis.cancel();textEl.value='';updateCount();pauseBtn.disabled=true;setStatus('文字已清除。')});
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
